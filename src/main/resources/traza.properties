# =========================================================
# TRAZA · Configuración de la conexión
# Cambia estos valores si tu PostgreSQL usa otro usuario o clave.
# (También se pueden poner como variables de entorno:
#  TRAZA_DB_URL, TRAZA_DB_USUARIO, TRAZA_DB_CLAVE, TRAZA_EVIDENCIAS)
# =========================================================
db.url=jdbc:postgresql://localhost:5432/traza
db.usuario=traza_app
db.clave=traza2026

# Carpeta donde se guardan los archivos de las evidencias.
# Si se deja vacía se usa la carpeta «traza-evidencias» dentro de tu usuario.
evidencias.carpeta=
